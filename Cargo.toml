[workspace]
members = ["crates/agent-client", "crates/rfb-probe", "crates/rustvnc-client", "vendor/vnc-rs"]
resolver = "3"

# The Apple pseudo-encodings (1104/1105/1109/1110), the zlib(6) rectangle
# encoding and non-fatal handling of unknown encodings all live inside the
# protocol engine's closed enums, so they cannot be added from outside.
# `vendor/vnc-rs` is upstream 0.6.1 plus those patches; see PATCHES.md there.
[patch.crates-io]
vnc-rs = { path = "vendor/vnc-rs" }

[package]
name = "rustvnc-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "RustVNC macOS agent (A2b: menu bar server, clipboard, Core Audio Tap + Opus)"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
flexaudio-core = "0.8"
flexaudio-os-macos = "0.8"
fs2 = "0.4"
hex = "0.4"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
opus = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.9"
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
security-framework = "3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
signal-hook = "0.3"
subtle = "2"
tao = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
foreign-types-shared = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
