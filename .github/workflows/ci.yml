name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A workflow-file mistake does not fail a step: GitHub rejects the whole file
  # before any job runs, so the pipeline silently stops reporting. Lint them
  # explicitly (this is what caught `secrets` being used inside `if:`).
  workflows:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.9
        with:
          args: -color

  # The agent package is macOS-only (objc2 / Core Audio), so the whole workspace
  # only builds here. The Windows jobs are scoped to the packages that compile
  # there.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: Test (release)
        # Optimised builds catch overflow-dependent bugs that a debug build
        # panics on in a different place; artefacts are warm from the step above.
        run: cargo test --workspace --release
      - name: Check script permissions
        # A shell script committed without the executable bit only fails later,
        # inside the signing/notarization path, where it is expensive to debug.
        run: |
          status=0
          for script in scripts/*.sh; do
            if [ ! -x "$script" ]; then
              echo "::error file=$script::not executable (git update-index --chmod=+x $script)"
              status=1
            fi
          done
          exit $status
      - name: Build agent bundle (ad-hoc)
        # Catches broken Info.plist / LaunchAgent plist / codesign layout without
        # needing a Developer ID in CI.
        run: ./scripts/build-app.sh release

  deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  security:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Advisories, not just licences: cargo-deny above already covers policy.
      # Run the binary directly instead of rustsec/audit-check: that action wants
      # `checks: write` to annotate, which a read-only workflow does not grant.
      - name: cargo audit (RustSec)
        # `.cargo/audit.toml` carries the one accepted advisory with its
        # reachability argument; unmaintained/unsound warnings are triaged in
        # M3-REPORT.md §5 and do not fail the build.
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: SBOM (CycloneDX)
        run: |
          python3 scripts/sbom.py > sbom.cdx.json
          python3 - <<'EOF'
          import json
          bom = json.load(open("sbom.cdx.json"))
          assert bom["specVersion"] == "1.5", bom["specVersion"]
          assert bom["components"], "empty SBOM"
          print(f"{len(bom['components'])} components")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install system audio libraries
        # `opus` -> `alsa-sys` on Linux: the fuzz crate links the agent client.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config cmake
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz the Apple metadata parser
        run: cd fuzz && cargo +nightly fuzz run apple_metadata -- -max_total_time=45 -rss_limit_mb=2048
      - name: Fuzz the agent control decoder
        run: cd fuzz && cargo +nightly fuzz run control_msg -- -max_total_time=45 -rss_limit_mb=2048
      - name: Keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A committed credential is the one finding that cannot be patched out
      # later, so it is checked on every push rather than at release time.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    runs-on: windows-2025
    # `secrets.*` is not allowed inside `if:` expressions (GitHub rejects the
    # whole workflow file); map the secrets to env and test those instead.
    env:
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup and WiX
        run: |
          choco install innosetup -y --no-progress
          choco install wixtoolset -y --no-progress
      - name: Materialise signing certificate
        # Optional: without the secret the installer is built unsigned and
        # `sign.ps1` says so instead of failing the build.
        if: env.WINDOWS_SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          "RUSTVNC_SIGN_CERT=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RUSTVNC_SIGN_PASSWORD=$env:WINDOWS_SIGN_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RUSTVNC_REQUIRE_SIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installers
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
          powershell -ExecutionPolicy Bypass -File packaging/windows/build-msi.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: rustvnc-windows-installer
          path: |
            packaging/windows/output/*.exe
            packaging/windows/output/*.msi
          if-no-files-found: error

  windows-client:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format (Windows packages)
        run: cargo fmt --all --check
      - name: Clippy (Windows packages)
        # `--workspace` cannot work here: the root package is the macOS agent.
        run: cargo clippy -p rustvnc-client -p rustvnc-agent-client -p vnc-rs -p rfb-probe --all-targets -- -D warnings
      - name: Test probe
        run: cargo test -p rfb-probe
      - name: Test agent client (QUIC/TLS loopback + Opus)
        run: cargo test -p rustvnc-agent-client
      - name: Test client (session, encodings, idle cost)
        run: cargo test -p rustvnc-client
      - name: Build client
        run: cargo build -p rustvnc-client
      - name: Test (release)
        # The Windows half of the release-mode gate; the macOS job covers the
        # whole workspace.
        run: cargo test --release -p rustvnc-client -p rustvnc-agent-client -p vnc-rs -p rfb-probe

  hardening:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the shipped binary
        run: cargo build --release -p rustvnc-client
      # The flags live in `.cargo/config.toml`; this asserts the produced PE
      # actually carries them, so a dropped rustflag fails the build.
      - name: Verify PE hardening bits
        run: python scripts/check-pe-hardening.py target/release/rustvnc-client.exe

