name: Release

# Tag-driven: builds a Developer ID signed + notarized agent bundle and a signed
# Windows installer. Everything degrades to "unsigned, with a warning" when the
# secrets are absent, so a fork can still cut a build.
#
# NOTE: `secrets.*` may not appear in an `if:` expression — GitHub rejects the
# whole workflow file with "Unrecognized named-value: 'secrets'". Secrets are
# therefore mapped to job-level `env` first, and the conditions test `env.*`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos-agent:
    runs-on: macos-15
    env:
      CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
      APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      SIGN_CERT_BASE64: ${{ secrets.MACOS_SIGN_CERT_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Developer ID certificate
        if: env.SIGN_CERT_BASE64 != ''
        env:
          CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$SIGN_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          existing_keychains=$(security list-keychains -d user | tr -d '"')
          # The existing list is several quoted paths; splitting it back apart is
          # the point, so the unquoted expansion is intentional.
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $existing_keychains
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Store notarization credentials
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build, sign and notarize
        run: |
          set -euo pipefail
          if [ -z "${CODESIGN_IDENTITY:-}" ]; then
            echo "::warning::MACOS_SIGN_IDENTITY is not set - building an ad-hoc, un-notarized bundle"
            NOTARY_PROFILE='' ./scripts/build-app.sh release
          else
            ./scripts/build-app.sh release
          fi
      - name: Package
        run: ditto -c -k --keepParent "dist/RustVNC Agent.app" "dist/rustvnc-agent-${{ github.ref_name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rustvnc-agent-macos
          path: dist/*.zip
          if-no-files-found: error

  windows-client:
    runs-on: windows-latest
    env:
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Materialise signing certificate
        if: env.WINDOWS_SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          "RUSTVNC_SIGN_CERT=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RUSTVNC_SIGN_PASSWORD=$env:WINDOWS_SIGN_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RUSTVNC_REQUIRE_SIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rustvnc-windows-installer
          path: packaging/windows/output/*.exe
          if-no-files-found: error
