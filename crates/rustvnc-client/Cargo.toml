[package]
name = "rustvnc-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "RustVNC Windows client (M1 session core + egui UI)"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
arboard = "3"
dirs = "7"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.33"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vnc-rs = "0.6"

[dev-dependencies]
tempfile = "3"
