[package]
name = "rustvnc-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "RustVNC Windows client (M1 session core + egui UI)"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
hex = "0.4"
auto-launch = "0.6"
arboard = "3"
dirs = "7"
eframe = { version = "0.33", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
egui = "0.33"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
tray-icon = { version = "0.26", default-features = false }
vnc-rs = "0.6"
rustvnc-agent-client = { path = "../agent-client" }
# Enabling eframe's `wgpu` feature alone is not enough: without this direct dependency
# naming a backend, wgpu panics at startup with "no backend feature that is
# implemented for the target platform was enabled".
wgpu = { version = "27", features = ["dx12"] }

[dev-dependencies]
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Single-instance mutex + the activation event another launch signals.
# `Win32_Security` is required because CreateMutexW/CreateEventW take a
# SECURITY_ATTRIBUTES pointer even when it is null.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    # ConvertSidToStringSidW, for the per-user part of the lock name.
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
